name: Quarterly PLVR Data Fetch

on:
  # Quarterly on 1st of Feb/May/Aug/Nov at 03:00 UTC
  # PLVR data cadence: Q1→May, Q2→Aug, Q3→Nov, Q4→Feb
  schedule:
    - cron: '0 3 1 2,5,8,11 *'
  # Manual trigger from Actions tab
  workflow_dispatch:
    inputs:
      validate_only:
        description: 'Run smoke test on existing transactions.json without downloading'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write   # push updated transactions.json
  actions: write    # trigger deploy.yml after data commit

concurrency:
  group: plvr-fetch
  cancel-in-progress: false  # never cancel a running data fetch

jobs:
  fetch-plvr:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download and parse PLVR data
        if: ${{ github.event.inputs.validate_only != 'true' }}
        run: node_modules/.bin/tsx scripts/fetch-plvr.ts
        env:
          # Allow up to 10000 features per export (default); override if needed
          EXPORT_LIMIT: '10000'
          # Minimum features required for smoke test to pass
          MIN_FEATURES: '100'

      - name: CI smoke test — validate output GeoJSON
        # Always run validation: on scheduled runs after download; on validate_only runs standalone
        run: node_modules/.bin/tsx scripts/fetch-plvr.ts --validate
        env:
          MIN_FEATURES: '100'

      - name: Commit updated transactions.json
        if: ${{ github.event.inputs.validate_only != 'true' }}
        id: commit_data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B main origin/main
          git add frontend/public/data/transactions.json
          if git diff --cached --quiet; then
            echo "No changes to commit — data is already up-to-date"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            RECORD_COUNT=$(node -e "
              const d = JSON.parse(require('fs').readFileSync('frontend/public/data/transactions.json', 'utf8'));
              console.log(d.features.length);
            ")
            git commit -m "$(printf 'chore(data): refresh 實價登錄 data [%s records]\n\nAutomated quarterly PLVR pipeline run via .github/workflows/fetch-plvr.yml\nSource: 內政部 plvr.land.moi.gov.tw open data' "${RECORD_COUNT}")"
            git pull --rebase origin main
            git push origin main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes with GITHUB_TOKEN do not auto-trigger other workflows.
      # Explicitly dispatch deploy.yml so the updated data goes live on GitHub Pages.
      - name: Trigger GitHub Pages deploy
        if: ${{ steps.commit_data.outputs.pushed == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main',
            });
            console.log('Triggered deploy.yml for updated 實價登錄 data');
